{{define "content"}}{{with .Data}}
<h1>Messages</h1>
<div class="tabs">
  <a href="/messages" {{if and (not .Filter.Kind) (not .Filter.Area)}}class="on"{{end}}>All</a>
  <a href="/messages?kind=P" {{if eq .Filter.Kind "P"}}class="on"{{end}}>Personal</a>
  <a href="/messages?kind=B" {{if and (eq .Filter.Kind "B") (not .Filter.Area)}}class="on"{{end}}>Bulletins</a>
  {{$area := .Filter.Area}}{{range .Areas}}<a href="/messages?area={{.Name}}" {{if eq $area .Name}}class="on"{{end}}>{{.Name}}</a>{{end}}
</div>
<div class="wrap"><table>
<tr><th class="num">#</th><th>K</th><th>From</th><th>To</th><th>Subject</th><th class="hide-sm">Date</th><th class="num hide-sm">Size</th></tr>
{{range .Messages}}
<tr><td class="num">{{.Seq}}</td><td>{{.Kind}}</td><td>{{.From}}</td><td>{{.To}}</td>
<td><a href="/messages/{{.ID}}">{{.Subject}}</a></td><td class="hide-sm">{{date .Created}}</td><td class="num hide-sm">{{bytes .Size}}</td></tr>
{{else}}<tr><td colspan="7" class="muted">No messages.</td></tr>{{end}}
</table></div>
{{end}}{{end}}
