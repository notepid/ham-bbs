# Release builds: https://goreleaser.com
# Triggered by pushing a tag like v0.1.0 (see .github/workflows/release.yml).
version: 2
project_name: hambbs

before:
  hooks:
    - go mod tidy
    - go test ./...

builds:
  - id: hambbs-server
    main: ./cmd/hambbs-server
    binary: hambbs-server
    env: [CGO_ENABLED=0]
    flags: [-trimpath]
    ldflags:
      - -s -w -X github.com/notepid/ham-bbs/internal/buildinfo.Version=v{{ .Version }}
    goos: [linux, windows, darwin]
    goarch: [amd64, arm64, arm]
    goarm: ["6"] # armv6 runs on every 32-bit Raspberry Pi, Zero included
    ignore:
      - { goos: windows, goarch: arm }
      - { goos: darwin, goarch: arm }
  - id: hambbs-client
    main: ./cmd/hambbs-client
    binary: hambbs-client
    env: [CGO_ENABLED=0]
    flags: [-trimpath]
    ldflags:
      - -s -w -X github.com/notepid/ham-bbs/internal/buildinfo.Version=v{{ .Version }}
    goos: [linux, windows, darwin]
    goarch: [amd64, arm64, arm]
    goarm: ["6"]
    ignore:
      - { goos: windows, goarch: arm }
      - { goos: darwin, goarch: arm }

# One archive per program: users only need the client, sysops the server.
archives:
  - id: server
    ids: [hambbs-server]
    name_template: >-
      hambbs-server_{{ .Version }}_{{ .Os }}_{{ if eq .Arch "arm" }}armv{{ .Arm }}{{ else }}{{ .Arch }}{{ end }}
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    files: &docs
      - LICENSE
      - README.md
      - docs/*.md
  - id: client
    ids: [hambbs-client]
    name_template: >-
      hambbs-client_{{ .Version }}_{{ .Os }}_{{ if eq .Arch "arm" }}armv{{ .Arm }}{{ else }}{{ .Arch }}{{ end }}
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    files: *docs

checksum:
  name_template: checksums.txt

changelog:
  sort: asc
  filters:
    exclude: ["^docs:", "^test:", "^ci:"]

release:
  draft: false
  prerelease: auto # tags like v0.2.0-rc1 become pre-releases
  header: |
    **Users:** download `hambbs-client` for your system. It runs on your computer and opens in the browser.
    **Sysops:** download `hambbs-server` to run a BBS.

    Linux `armv6` runs on every Raspberry Pi; use `arm64` for a 64-bit Raspberry Pi OS.

    **Updating:** stop the program, replace the program file and start it again. Settings and messages are kept. See [Updating](https://github.com/notepid/ham-bbs/blob/main/docs/setup.md#updating).
